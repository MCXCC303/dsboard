[package]
name = "dsboard"
version = "0.1.0"
edition = "2024"
description = "DeepSeek 用量看板"

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = { version = "0.47.0", features = ["async", "async-spawn"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
waki = "0.5.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
